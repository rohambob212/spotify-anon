[package]
name = "spotify-anon"
version = "0.2.0"
edition = "2021"
description = "Keyless Spotify client: search tracks and fetch full track/album/artist metadata with no API credentials, using the public web player's own anonymous session."
license = "MIT"
readme = "README.md"
repository = "https://github.com/rohambob212/spotify-anon"
homepage = "https://github.com/rohambob212/spotify-anon"
documentation = "https://docs.rs/spotify-anon"
keywords = ["spotify", "music", "metadata", "api"]
categories = ["api-bindings"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }

[features]
default = ["blocking"]
blocking = ["reqwest/blocking"]
# Async facade: a pool of owner threads around the blocking client. Needs only
# tokio's oneshot channel, so it runs on any executor.
async = ["blocking", "dep:tokio"]

[profile.release]
opt-level = 2
strip = true
